openapi: 3.1.0
info:
  title: NextChapter API
  version: 0.1.0-bootstrap
  description: |
    Bootstrap-milestone surface for NextChapter. Covers auth, the first-run
    registration window, series CRUD, and per-site entry capture and listing.
    Scope is deliberately narrow; tags, search, site-rule sync, and the full
    library view ship in later milestones.

    All timestamps are RFC 3339 UTC. All money-less numeric fields are JSON
    numbers; in particular `last_chapter` is a number, never a string.

servers:
  - url: http://localhost:8080
    description: Local dev

tags:
  - name: auth
  - name: series
  - name: entries
  - name: meta

security:
  - cookieAuth: []
  - bearerAuth: []

paths:
  /healthz:
    get:
      tags: [meta]
      summary: Liveness probe.
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }

  /auth/register:
    post:
      tags: [auth]
      summary: Create the first user (open-registration window only).
      description: |
        Available only while the `users` table is empty AND no env-var
        bootstrap is configured. After the first user is created this endpoint
        returns 404. See ADR-0006.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: User created; session cookie set.
          headers:
            Set-Cookie:
              schema: { type: string }
              description: nc_session HttpOnly cookie.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404':
          description: Registration window closed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /auth/login:
    post:
      tags: [auth]
      summary: Exchange username + password for a session cookie.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Logged in; session cookie set.
          headers:
            Set-Cookie:
              schema: { type: string }
              description: nc_session HttpOnly cookie.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /auth/logout:
    post:
      tags: [auth]
      summary: Invalidate the current session cookie.
      responses:
        '204':
          description: Logged out.
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/me:
    get:
      tags: [auth]
      summary: Return the authenticated user.
      responses:
        '200':
          description: Current user.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/tokens:
    post:
      tags: [auth]
      summary: Mint a new API token for the extension.
      description: |
        The raw token is returned exactly once in this response. The server
        only stores its SHA-256 hash. Show it to the user, then forget it.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApiTokenCreateRequest' }
      responses:
        '201':
          description: Created; includes the raw token.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiTokenCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /auth/tokens/{id}:
    delete:
      tags: [auth]
      summary: Revoke an API token.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '204':
          description: Revoked.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /series:
    get:
      tags: [series]
      summary: List the user's series.
      parameters:
        - in: query
          name: status
          schema: { $ref: '#/components/schemas/SeriesStatus' }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: Page of series, with per-series highest-chapter rollup.
          content:
            application/json:
              schema:
                type: object
                required: [items, total]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/SeriesSummary' }
                  total: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [series]
      summary: Create a new (empty) series.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SeriesCreateRequest' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Series' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /series/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer, format: int64 }
    get:
      tags: [series]
      summary: Fetch one series with its per-site entries.
      responses:
        '200':
          description: Series detail.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SeriesDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [series]
      summary: Update series fields (title, status, rating, notes).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SeriesUpdateRequest' }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Series' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [series]
      summary: Delete a series and cascade its entries.
      responses:
        '204':
          description: Deleted.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /entries:
    get:
      tags: [entries]
      summary: List entries, optionally filtered by series.
      parameters:
        - in: query
          name: series_id
          schema: { type: integer, format: int64 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: Page of entries.
          content:
            application/json:
              schema:
                type: object
                required: [items, total]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Entry' }
                  total: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /entries/capture:
    post:
      tags: [entries]
      summary: Click-to-capture endpoint used by the extension.
      description: |
        Idempotent on `(user_id, site_host, series_slug)`. If an entry with
        that key exists, advance `last_chapter` (monotonic — never rewinds)
        and update `last_url`, `last_captured_at`, and `site_title`. If not,
        create a new entry attached to the supplied `series_id` (or a new
        series created from `new_series_title` if `series_id` is absent).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CaptureRequest' }
      responses:
        '200':
          description: Existing entry advanced.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Entry' }
        '201':
          description: New entry created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Entry' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /entries/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer, format: int64 }
    patch:
      tags: [entries]
      summary: Edit an entry. Used for reassignment and manual correction.
      description: |
        Set `series_id` to move this entry under a different series. Set
        `last_chapter` to override the captured value. All fields are
        optional; only provided fields change.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EntryUpdateRequest' }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Entry' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [entries]
      summary: Delete a single entry.
      responses:
        '204':
          description: Deleted.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: nc_session
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque

  responses:
    Unauthorized:
      description: Missing or invalid credentials.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Resource does not exist or is not owned by the caller.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ValidationError:
      description: |
        Request was parsed but failed semantic validation (e.g. field
        out of range, missing required field, unknown enum value). The
        `error.fields` map carries per-field messages.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    BadRequest:
      description: |
        Request body could not be parsed (malformed JSON, wrong content
        type, type mismatch on a field, e.g. string where number is
        expected). Distinct from 422 — see ADR-0008. `error.fields` is
        omitted because no field-level information is available when the
        parser fails before binding completes.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ok] }
        version: { type: string }

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, description: machine-readable code, e.g. unauthorized, not_found, validation }
            message: { type: string }
            fields:
              type: object
              additionalProperties: { type: string }
              description: Per-field validation messages, when applicable.

    User:
      type: object
      required: [id, username, created_at]
      properties:
        id: { type: integer, format: int64 }
        username: { type: string }
        created_at: { type: string, format: date-time }

    RegisterRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string, minLength: 1, maxLength: 64 }
        password: { type: string, minLength: 8, maxLength: 256 }

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string }

    ApiTokenCreateRequest:
      type: object
      required: [label]
      properties:
        label: { type: string, minLength: 1, maxLength: 64 }
        expires_at:
          type: string
          format: date-time
          nullable: true

    ApiToken:
      type: object
      required: [id, label, created_at]
      properties:
        id: { type: integer, format: int64 }
        label: { type: string }
        created_at: { type: string, format: date-time }
        last_used_at: { type: string, format: date-time, nullable: true }
        expires_at: { type: string, format: date-time, nullable: true }

    ApiTokenCreated:
      allOf:
        - $ref: '#/components/schemas/ApiToken'
        - type: object
          required: [token]
          properties:
            token:
              type: string
              description: |
                The raw token (`nca_...`). Returned exactly once. The server
                only stores its SHA-256 hash.

    SeriesStatus:
      type: string
      enum: [reading, completed, on_hold, dropped, plan_to_read]

    Series:
      type: object
      required: [id, title, status, notes, created_at, updated_at]
      properties:
        id: { type: integer, format: int64 }
        title: { type: string }
        status: { $ref: '#/components/schemas/SeriesStatus' }
        rating: { type: integer, minimum: 1, maximum: 10, nullable: true }
        notes: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    SeriesSummary:
      allOf:
        - $ref: '#/components/schemas/Series'
        - type: object
          required: [highest_chapter, entry_count]
          properties:
            highest_chapter:
              type: number
              nullable: true
              description: MAX(last_chapter) across entries for this series; null if no entries.
            entry_count: { type: integer }
            last_captured_at:
              type: string
              format: date-time
              nullable: true

    SeriesDetail:
      allOf:
        - $ref: '#/components/schemas/SeriesSummary'
        - type: object
          required: [entries]
          properties:
            entries:
              type: array
              items: { $ref: '#/components/schemas/Entry' }

    SeriesCreateRequest:
      type: object
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 256 }
        status: { $ref: '#/components/schemas/SeriesStatus' }
        rating: { type: integer, minimum: 1, maximum: 10, nullable: true }
        notes: { type: string, maxLength: 8192 }

    SeriesUpdateRequest:
      type: object
      properties:
        title: { type: string, minLength: 1, maxLength: 256 }
        status: { $ref: '#/components/schemas/SeriesStatus' }
        rating: { type: integer, minimum: 1, maximum: 10, nullable: true }
        notes: { type: string, maxLength: 8192 }

    Entry:
      type: object
      required:
        - id
        - series_id
        - site_host
        - series_slug
        - site_title
        - last_chapter
        - last_url
        - last_captured_at
        - created_at
        - updated_at
      properties:
        id: { type: integer, format: int64 }
        series_id: { type: integer, format: int64 }
        site_host: { type: string, description: lowercased host, no www. prefix }
        series_slug: { type: string }
        site_title: { type: string }
        last_chapter:
          type: number
          description: Numeric; supports fractional chapters like 12.5.
        last_url: { type: string, format: uri }
        last_captured_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CaptureRequest:
      type: object
      required: [site_host, series_slug, site_title, chapter, url]
      properties:
        site_host: { type: string, minLength: 1, maxLength: 253 }
        series_slug: { type: string, minLength: 1, maxLength: 512 }
        site_title: { type: string, minLength: 1, maxLength: 512 }
        chapter:
          type: number
          minimum: 0
          description: Chapter number observed on this click. Monotonic per entry.
        url: { type: string, format: uri, maxLength: 2048 }
        series_id:
          type: integer
          format: int64
          nullable: true
          description: |
            Required when a new entry is being created and `new_series_title`
            is absent. Ignored when updating an existing entry (server keeps
            its current series — reassignment happens via PATCH /entries/{id}).
        new_series_title:
          type: string
          nullable: true
          minLength: 1
          maxLength: 256
          description: |
            When set, and no entry yet exists for (site_host, series_slug),
            the server creates a new series with this title and attaches the
            new entry to it.

    EntryUpdateRequest:
      type: object
      properties:
        series_id:
          type: integer
          format: int64
          description: Move this entry under a different series.
        last_chapter: { type: number, minimum: 0 }
        last_url: { type: string, format: uri }
        site_title: { type: string, minLength: 1, maxLength: 512 }
