basePath: /
definitions:
  handlers.ErrorBody:
    properties:
      error:
        $ref: '#/definitions/handlers.ErrorDetail'
    type: object
  handlers.ErrorDetail:
    properties:
      code:
        type: string
      fields:
        additionalProperties:
          type: string
        type: object
      message:
        type: string
    type: object
  models.APIToken:
    properties:
      created_at:
        type: string
      expires_at:
        type: string
      id:
        type: integer
      label:
        type: string
      last_used_at:
        type: string
      token:
        description: |-
          Raw is the plaintext token, surfaced exactly once on
          POST /auth/tokens. The server stores only the hash; subsequent
          reads return APIToken values with Raw == "" (omitempty drops the
          key entirely from the wire payload).
        type: string
    type: object
  models.Credentials:
    properties:
      password:
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
  models.Entry:
    properties:
      created_at:
        type: string
      id:
        type: integer
      last_captured_at:
        type: string
      last_chapter:
        type: number
      last_url:
        type: string
      series_id:
        type: integer
      series_slug:
        type: string
      site_host:
        type: string
      site_title:
        type: string
      updated_at:
        type: string
    type: object
  models.EntryCapture:
    properties:
      chapter:
        minimum: 0
        type: number
      new_series_title:
        type: string
      series_id:
        minimum: 1
        type: integer
      series_slug:
        maxLength: 512
        minLength: 1
        type: string
      site_host:
        maxLength: 253
        minLength: 1
        type: string
      site_title:
        maxLength: 512
        minLength: 1
        type: string
      url:
        maxLength: 2048
        minLength: 1
        type: string
    required:
    - chapter
    - series_slug
    - site_host
    - site_title
    - url
    type: object
  models.EntryList:
    properties:
      items:
        items:
          $ref: '#/definitions/models.Entry'
        type: array
      total:
        type: integer
    type: object
  models.EntryPatch:
    properties:
      last_chapter:
        minimum: 0
        type: number
      last_url:
        type: string
      series_id:
        minimum: 1
        type: integer
      site_title:
        maxLength: 512
        minLength: 1
        type: string
    type: object
  models.Health:
    properties:
      status:
        type: string
      version:
        type: string
    type: object
  models.NewToken:
    properties:
      expires_at:
        type: string
      label:
        maxLength: 64
        minLength: 1
        type: string
    required:
    - label
    type: object
  models.Registration:
    properties:
      password:
        maxLength: 256
        minLength: 8
        type: string
      username:
        maxLength: 64
        minLength: 1
        type: string
    required:
    - password
    - username
    type: object
  models.Series:
    properties:
      created_at:
        type: string
      id:
        type: integer
      notes:
        type: string
      rating:
        type: integer
      status:
        type: string
      title:
        type: string
      updated_at:
        type: string
    type: object
  models.SeriesDetail:
    properties:
      created_at:
        type: string
      entries:
        items:
          $ref: '#/definitions/models.Entry'
        type: array
      entry_count:
        type: integer
      highest_chapter:
        type: number
      id:
        type: integer
      last_captured_at:
        type: string
      notes:
        type: string
      rating:
        type: integer
      status:
        type: string
      title:
        type: string
      updated_at:
        type: string
    type: object
  models.SeriesList:
    properties:
      items:
        items:
          $ref: '#/definitions/models.SeriesSummary'
        type: array
      total:
        type: integer
    type: object
  models.SeriesNew:
    properties:
      notes:
        maxLength: 8192
        type: string
      rating:
        maximum: 10
        minimum: 1
        type: integer
      status:
        enum:
        - reading
        - completed
        - on_hold
        - dropped
        - plan_to_read
        type: string
      title:
        maxLength: 256
        minLength: 1
        type: string
    required:
    - title
    type: object
  models.SeriesPatch:
    properties:
      notes:
        maxLength: 8192
        type: string
      rating:
        maximum: 10
        minimum: 1
        type: integer
      status:
        enum:
        - reading
        - completed
        - on_hold
        - dropped
        - plan_to_read
        type: string
      title:
        maxLength: 256
        minLength: 1
        type: string
    type: object
  models.SeriesSummary:
    properties:
      created_at:
        type: string
      entry_count:
        type: integer
      highest_chapter:
        type: number
      id:
        type: integer
      last_captured_at:
        type: string
      notes:
        type: string
      rating:
        type: integer
      status:
        type: string
      title:
        type: string
      updated_at:
        type: string
    type: object
  models.User:
    properties:
      created_at:
        type: string
      id:
        type: integer
      username:
        type: string
    type: object
info:
  contact:
    name: NextChapter
  description: |-
    NextChapter is a self-hosted progress tracker for manhwa, manhua, and web novels.
    Open registration — anyone can create an account via /auth/register.

    Auth: session cookie ("nc_session") OR Authorization: Bearer <api token>.
  license:
    name: See LICENSE
  title: NextChapter API
  version: "1.0"
paths:
  /:
    get:
      description: Placeholder text until the SPA ships (ADR-0004). Unauthenticated.
      produces:
      - text/plain
      responses:
        "200":
          description: NextChapter API. See /healthz.
          schema:
            type: string
      summary: API root placeholder
      tags:
      - meta
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticates the supplied credentials. On success the server sets
        the nc_session cookie and returns the authenticated user.
      parameters:
      - description: credentials
        in: body
        name: credentials
        required: true
        schema:
          $ref: '#/definitions/models.Credentials'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.User'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorBody'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorBody'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/handlers.ErrorBody'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorBody'
      summary: Log in with username and password
      tags:
      - auth
  /auth/logout:
    post:
      description: Deletes the session row (if cookie-authed) and clears the nc_session
        cookie. Idempotent.
      responses:
        "204":
          description: no content
      security:
      - CookieAuth: []
      - BearerAuth: []
      summary: Log out the current session
      tags:
      - auth
  /auth/me:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.User'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorBody'
      security:
      - CookieAuth: []
      - BearerAuth: []
      summary: Return the currently authenticated user
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: 'Open registration: anyone can create an account. On success the
        server sets the nc_session cookie and returns the new user.'
      parameters:
      - description: credentials
        in: body
        name: registration
        required: true
        schema:
          $ref: '#/definitions/models.Registration'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.User'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorBody'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/handlers.ErrorBody'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorBody'
      summary: Register a new user account
      tags:
      - auth
  /auth/tokens:
    post:
      consumes:
      - application/json
      description: Returns the plaintext token exactly once on the `token` field.
        The server stores only the hash; subsequent reads omit `token`.
      parameters:
      - description: token metadata
        in: body
        name: token
        required: true
        schema:
          $ref: '#/definitions/models.NewToken'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.APIToken'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorBody'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/handlers.ErrorBody'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorBody'
      security:
      - CookieAuth: []
      - BearerAuth: []
      summary: Mint a new API token for the current user
      tags:
      - auth
  /auth/tokens/{id}:
    delete:
      parameters:
      - description: token id
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: no content
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ErrorBody'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorBody'
      security:
      - CookieAuth: []
      - BearerAuth: []
      summary: Revoke an API token
      tags:
      - auth
  /entries:
    get:
      parameters:
      - description: filter by series id
        in: query
        minimum: 1
        name: series_id
        type: integer
      - default: 50
        description: page size
        in: query
        maximum: 200
        minimum: 1
        name: limit
        type: integer
      - default: 0
        description: page offset
        in: query
        minimum: 0
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.EntryList'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorBody'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/handlers.ErrorBody'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorBody'
      security:
      - CookieAuth: []
      - BearerAuth: []
      summary: List per-site reading positions
      tags:
      - entries
  /entries/{id}:
    delete:
      parameters:
      - description: entry id
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: no content
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ErrorBody'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorBody'
      security:
      - CookieAuth: []
      - BearerAuth: []
      summary: Forget a single per-site reading position
      tags:
      - entries
    patch:
      consumes:
      - application/json
      description: 'Pointer fields use the absent/present binary: missing fields are
        left unchanged.'
      parameters:
      - description: entry id
        in: path
        name: id
        required: true
        type: integer
      - description: fields to update
        in: body
        name: entry
        required: true
        schema:
          $ref: '#/definitions/models.EntryPatch'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Entry'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorBody'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ErrorBody'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/handlers.ErrorBody'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorBody'
      security:
      - CookieAuth: []
      - BearerAuth: []
      summary: Adjust an existing entry
      tags:
      - entries
  /entries/capture:
    post:
      consumes:
      - application/json
      description: Upserts on (user, site_host, series_slug). The handler lowercases
        site_host and strips a leading `www.` before persisting (ADR-0008). If no
        entry exists for that key, the caller must supply either `series_id` (existing)
        or `new_series_title` (the handler will materialise a series row); otherwise
        422. Returns 201 on first capture for the (host,slug) key, 200 when an existing
        entry was advanced.
      parameters:
      - description: captured reading position
        in: body
        name: capture
        required: true
        schema:
          $ref: '#/definitions/models.EntryCapture'
      produces:
      - application/json
      responses:
        "200":
          description: advanced an existing entry
          schema:
            $ref: '#/definitions/models.Entry'
        "201":
          description: created a new entry
          schema:
            $ref: '#/definitions/models.Entry'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorBody'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/handlers.ErrorBody'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorBody'
      security:
      - CookieAuth: []
      - BearerAuth: []
      summary: Capture or advance a reading position
      tags:
      - entries
  /healthz:
    get:
      description: Returns {"status":"ok"} and the server build version. Unauthenticated.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Health'
      summary: Liveness / version probe
      tags:
      - meta
  /series:
    get:
      parameters:
      - description: filter by status
        enum:
        - reading
        - completed
        - on_hold
        - dropped
        - plan_to_read
        in: query
        name: status
        type: string
      - default: 50
        description: page size
        in: query
        maximum: 200
        minimum: 1
        name: limit
        type: integer
      - default: 0
        description: page offset
        in: query
        minimum: 0
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.SeriesList'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorBody'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/handlers.ErrorBody'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorBody'
      security:
      - CookieAuth: []
      - BearerAuth: []
      summary: List the user's tracked series
      tags:
      - series
    post:
      consumes:
      - application/json
      parameters:
      - description: series metadata
        in: body
        name: series
        required: true
        schema:
          $ref: '#/definitions/models.SeriesNew'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.Series'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorBody'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/handlers.ErrorBody'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorBody'
      security:
      - CookieAuth: []
      - BearerAuth: []
      summary: Track a new series
      tags:
      - series
  /series/{id}:
    delete:
      parameters:
      - description: series id
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: no content
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ErrorBody'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorBody'
      security:
      - CookieAuth: []
      - BearerAuth: []
      summary: Untrack a series and its entries
      tags:
      - series
    get:
      parameters:
      - description: series id
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.SeriesDetail'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ErrorBody'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorBody'
      security:
      - CookieAuth: []
      - BearerAuth: []
      summary: Fetch a single series with its per-site entries
      tags:
      - series
    patch:
      consumes:
      - application/json
      description: 'Pointer fields use the absent/present binary: missing fields are
        left unchanged. Sending `rating: null` is treated the same as omitting the
        field — clearing the rating is not supported via PATCH in v1.'
      parameters:
      - description: series id
        in: path
        name: id
        required: true
        type: integer
      - description: fields to update
        in: body
        name: series
        required: true
        schema:
          $ref: '#/definitions/models.SeriesPatch'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Series'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorBody'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ErrorBody'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/handlers.ErrorBody'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorBody'
      security:
      - CookieAuth: []
      - BearerAuth: []
      summary: Update mutable fields on a tracked series
      tags:
      - series
schemes:
- http
- https
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
  CookieAuth:
    in: cookie
    name: nc_session
    type: apiKey
swagger: "2.0"
