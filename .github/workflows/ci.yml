name: ci

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'packages/**'
      - 'web/**'
      - 'design/tokens.css'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - '.npmrc'
      - '.nvmrc'
      - 'eslint.config.js'
      - '.prettierrc.json'
      - '.prettierignore'
      - 'tsconfig.base.json'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'packages/**'
      - 'web/**'
      - 'design/tokens.css'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - '.npmrc'
      - '.nvmrc'
      - 'eslint.config.js'
      - '.prettierrc.json'
      - '.prettierignore'
      - 'tsconfig.base.json'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.2'
          cache: true
          cache-dependency-path: backend/go.sum

      - name: lint (gofmt + go vet + golangci-lint)
        run: make lint

      - name: test (race)
        run: make test-race

      - name: go mod tidy is clean
        run: |
          make tidy
          if ! git diff --exit-code -- go.mod go.sum; then
            echo "::error::go.mod / go.sum drift — run 'make tidy' locally and commit"
            exit 1
          fi

      - name: swagger is up to date
        run: |
          make swagger
          if ! git diff --exit-code -- internal/swaggerdocs; then
            echo "::error::internal/swaggerdocs is stale — run 'make swagger' locally and commit"
            exit 1
          fi

      # govulncheck is intentionally NOT run in CI yet: the reachable
      # findings are stdlib CVEs fixable only by a toolchain patch
      # release. See ADR-0007 (docs/adr/0007-deferred-stdlib-cves.md)
      # for the current deferred list and the re-enable condition;
      # `make security-audit` is the manual backstop.

  backend-postgres:
    # Dual-engine coverage. The default `backend` job exercises the
    # SQLite path (pure-Go, no Docker). This job runs the
    # Postgres-flavoured integration smoke test against a real
    # Postgres 16 instance provisioned via testcontainers-go inside
    # the runner. The two jobs run in parallel.
    name: backend (postgres)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.2'
          cache: true
          cache-dependency-path: backend/go.sum

      - name: test-postgres (testcontainer)
        run: make test-postgres

  frontend:
    # Lint, unit tests, codegen freshness, and both browser builds for the
    # extension track (pnpm workspace at the repo root).
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: install (frozen lockfile)
        run: make install

      - name: lint (eslint + prettier + tsc + depcheck)
        run: make lint

      - name: unit tests (vitest)
        run: make test

      - name: generated API types are up to date
        run: |
          make api-types
          if ! git diff --exit-code -- ../packages/api-client/src/generated; then
            echo "::error::packages/api-client/src/generated is stale — run 'make -C frontend api-types' locally and commit"
            exit 1
          fi

      - name: build (chromium mv3)
        run: make build

      - name: build (firefox mv3)
        run: make build-firefox

      - name: build (web spa)
        run: make web-build

  frontend-e2e:
    # The QA gate: Playwright e2e against the real backend binary inside the
    # pinned mcr.microsoft.com/playwright image (frontend/Dockerfile.test).
    # Firefox e2e is deferred by ADR-0008; the frontend job's firefox build
    # is the Firefox gate.
    name: frontend (e2e)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: e2e in pinned Playwright image
        run: make test-e2e-docker

  web-e2e:
    # The web QA gate: the SPA is built, embedded into the real backend
    # binary, and driven by Playwright — the production topology
    # (web/Dockerfile.test, ADR-0010).
    name: web (e2e)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: web e2e in pinned Playwright image
        run: make web-test-e2e-docker
