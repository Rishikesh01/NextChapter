name: ci

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.2'
          cache: true
          cache-dependency-path: backend/go.sum

      - name: lint (gofmt + go vet + golangci-lint)
        run: make lint

      - name: test (race)
        run: make test-race

      - name: go mod tidy is clean
        run: |
          make tidy
          if ! git diff --exit-code -- go.mod go.sum; then
            echo "::error::go.mod / go.sum drift — run 'make tidy' locally and commit"
            exit 1
          fi

      - name: swagger is up to date
        run: |
          make swagger
          if ! git diff --exit-code -- internal/swaggerdocs; then
            echo "::error::internal/swaggerdocs is stale — run 'make swagger' locally and commit"
            exit 1
          fi

      # govulncheck is intentionally NOT run in CI yet. There are
      # three reachable stdlib CVEs in go1.26.2 that close out with a
      # toolchain bump to go1.26.3. Until the host runners have
      # 1.26.3 (or we flip to GOTOOLCHAIN=auto), running govulncheck
      # here would just be a documented red. Re-enable after the bump.

  backend-postgres:
    # Dual-engine coverage. The default `backend` job exercises the
    # SQLite path (pure-Go, no Docker). This job runs the
    # Postgres-flavoured integration smoke test against a real
    # Postgres 16 instance provisioned via testcontainers-go inside
    # the runner. The two jobs run in parallel.
    name: backend (postgres)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.2'
          cache: true
          cache-dependency-path: backend/go.sum

      - name: test-postgres (testcontainer)
        run: make test-postgres
